<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Milestone Progress Logo">
  <defs>
    <linearGradient id="bgGrad" x1="14" y1="14" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="40" y1="36" x2="40" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
  </defs>

  <!-- Centered square badge with ~11% transparent outer margin for light/dark theme readability -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <rect x="15.5" y="15.5" width="97" height="97" rx="22.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Vertical milestone progress spine -->
  <line x1="42" y1="38" x2="42" y2="90" stroke="url(#trackGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Milestone 1: Completed (Emerald check) -->
  <circle cx="42" cy="38" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M37.5 38 L40.7 41.2 L46.8 34.8" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="60" y="34" width="38" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Milestone 2: Active / Current (Sky highlight ring) -->
  <circle cx="42" cy="64" r="10" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="42" cy="64" r="4" fill="#FFFFFF"/>
  <rect x="60" y="60" width="30" height="8" rx="4" fill="#BAE6FD"/>

  <!-- Milestone 3: Upcoming checkpoint (Flagged / paused) -->
  <circle cx="42" cy="90" r="8.5" fill="#1E1B4B" stroke="#C7D2FE" stroke-width="3"/>
  <rect x="60" y="86" width="22" height="8" rx="4" fill="#C7D2FE" fill-opacity="0.65"/>
</svg>
