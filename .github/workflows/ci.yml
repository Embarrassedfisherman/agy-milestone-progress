name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run full unit test suite
        run: python -m unittest discover -s tests -v

      - name: Run CI doctor integrity checks
        run: python scripts/doctor.py --ci --skip-tests --strict

      - name: Verify cross-platform sync and SHA-256 check
        run: |
          python scripts/sync.py --target ./_ci_sync_target --skip-tests --skip-validate --clean
          python scripts/sync.py --target ./_ci_sync_target --check --skip-tests --skip-validate

      - name: Verify clean runtime zip packaging
        run: python scripts/release.py --package --skip-tests --output ./_ci_release_preview.zip
